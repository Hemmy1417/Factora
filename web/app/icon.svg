<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The F-seal: a notary stamp with a serrated edge — the factoring act
       as a mark pressed into the instrument. Bank-note green on bond paper. -->
  <defs>
    <mask id="serration">
      <rect width="64" height="64" fill="white"/>
      <g fill="black">
        <circle cx="0" cy="0" r="4"/><circle cx="16" cy="0" r="4"/><circle cx="32" cy="0" r="4"/><circle cx="48" cy="0" r="4"/><circle cx="64" cy="0" r="4"/>
        <circle cx="0" cy="16" r="4"/><circle cx="64" cy="16" r="4"/>
        <circle cx="0" cy="32" r="4"/><circle cx="64" cy="32" r="4"/>
        <circle cx="0" cy="48" r="4"/><circle cx="64" cy="48" r="4"/>
        <circle cx="0" cy="64" r="4"/><circle cx="16" cy="64" r="4"/><circle cx="32" cy="64" r="4"/><circle cx="48" cy="64" r="4"/><circle cx="64" cy="64" r="4"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" fill="#0e5638" mask="url(#serration)"/>
  <rect x="9" y="9" width="46" height="46" fill="none" stroke="#f4f1e9" stroke-width="1.5"/>
  <path d="M 22 18 L 44 18 L 44 24 L 29 24 L 29 30 L 40 30 L 40 36 L 29 36 L 29 46 L 22 46 Z" fill="#f4f1e9"/>
</svg>
